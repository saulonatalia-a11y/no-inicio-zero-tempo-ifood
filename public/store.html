<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TurboFlow — Minha loja</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f5f7;color:#151515}.top{height:76px;background:#0b0b0b;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.brand{font-weight:950;font-size:25px;color:#ffd400}.top button{background:#222;color:#fff;border:1px solid #444;border-radius:9px;padding:9px 13px}.main{max-width:1050px;margin:32px auto;padding:0 18px}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:26px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.wide{grid-column:1/-1}.field span{display:block;font-size:13px;font-weight:850;margin:0 0 7px}.field input{width:100%;padding:13px 14px;border:1px solid #d8d8d8;border-radius:10px}.section{grid-column:1/-1;margin-top:8px;padding-top:18px;border-top:1px solid #eee}.actions{display:flex;justify-content:flex-end;margin-top:22px}.save{background:#ffd400;border:0;border-radius:10px;padding:14px 24px;font-weight:900}.msg{margin-top:14px;padding:12px;border-radius:10px;display:none}.ok{display:block;background:#eaf8ef;color:#237342}.err{display:block;background:#feecef;color:#9b3343}@media(max-width:720px){.grid{grid-template-columns:1fr}.wide,.section{grid-column:1}}</style></head>
<body><header class="top"><div class="brand">TURBOFLOW</div><button onclick="logout()">Sair</button></header><main class="main"><h1>Adicionar minha loja</h1><p>Esses dados ficam ligados somente à sua conta TurboFlow.</p>
<form id="storeForm" class="card"><div class="grid">
<div class="section"><h3>Dados principais</h3></div>
<label class="field"><span>Nome da loja *</span><input id="name" required></label><label class="field"><span>CNPJ</span><input id="cnpj"></label>
<label class="field"><span>Telefone da loja</span><input id="phone"></label><label class="field"><span>CEP</span><input id="zipCode"></label>
<div class="section"><h3>Endereço</h3></div>
<label class="field wide"><span>Endereço</span><input id="address"></label><label class="field"><span>Número</span><input id="number"></label>
<label class="field"><span>Complemento</span><input id="complement"></label><label class="field"><span>Bairro</span><input id="neighborhood"></label>
<label class="field"><span>Cidade</span><input id="city"></label><label class="field"><span>Estado</span><input id="state" maxlength="2"></label>
<div class="section"><h3>Responsável</h3></div>
<label class="field"><span>Nome do responsável</span><input id="contactName"></label><label class="field"><span>Telefone do responsável</span><input id="contactPhone"></label>
</div><div id="msg" class="msg"></div><div class="actions"><button class="save">Salvar e continuar</button></div></form></main>
<script>
const $=s=>document.querySelector(s);
async function boot(){const me=await fetch("/api/auth/me").then(r=>r.json());if(!me.user)return location.href="/login.html";if(me.user.role==="admin")return location.href="/admin.html";if(!me.access?.allowed)return location.href=me.access?.reason==="expired"?"/expired.html":"/pending.html";$("#contactName").value=me.user.name||"";const r=await fetch("/api/store");if(r.ok){const d=await r.json(),s=d.store||{};["name","cnpj","phone","address","number","complement","neighborhood","city","state","zipCode","contactName","contactPhone"].forEach(k=>{if($("#"+k)&&s[k]!=null)$("#"+k).value=s[k]})}}
$("#storeForm").onsubmit=async e=>{e.preventDefault();const payload={};["name","cnpj","phone","address","number","complement","neighborhood","city","state","zipCode","contactName","contactPhone"].forEach(k=>payload[k]=$("#"+k).value);const r=await fetch("/api/store",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});if(!r.ok){$("#msg").textContent="Não foi possível salvar.";$("#msg").className="msg err";return}$("#msg").textContent="Loja salva com sucesso.";$("#msg").className="msg ok";setTimeout(()=>location.href="/orders.html",500)}
async function logout(){await fetch("/api/auth/logout",{method:"POST"});location.href="/login.html"}boot();
</script></body></html>
