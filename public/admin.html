<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TurboFlow Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f5f7;color:#161616}
.top{background:#090909;color:#fff;padding:22px 28px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}
.brand{color:#ffd400;font-size:25px;font-weight:950}.top small{color:#bbb}.logout{background:#222;color:#fff;border:1px solid #444;padding:9px 14px;border-radius:9px;cursor:pointer}
main{max-width:1250px;margin:28px auto;padding:0 18px}
.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px}
.heading h1{margin:0 0 5px;font-size:31px}.heading p{margin:0;color:#68707d}
.stats{display:grid;grid-template-columns:repeat(4,minmax(100px,1fr));gap:10px}
.stat{background:#fff;border:1px solid #e0e2e5;border-radius:14px;padding:13px 15px;min-width:110px}
.stat b{font-size:24px;display:block}.stat span{font-size:12px;color:#666}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.filters button{padding:9px 14px;border:1px solid #d7d9dd;background:#fff;border-radius:999px;font-weight:800;cursor:pointer}
.filters button.active{background:#ffd400;border-color:#dfbc00}
#clients{display:grid;gap:14px}
.client-card{background:#fff;border:1px solid #dedfe3;border-radius:17px;padding:18px;box-shadow:0 3px 12px rgba(0,0,0,.025)}
.client-top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}
.identity h3{margin:0 0 5px;font-size:20px}.muted{color:#6c7480;font-size:13px}
.badge{display:inline-flex;align-items:center;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:900}
.pending{background:#fff1be;color:#765e00}.active{background:#e7f7ed;color:#176c3d}.expiring{background:#fff0dc;color:#a25500}.expired{background:#feecef;color:#9b2e40}.blocked{background:#eceef1;color:#555}
.details{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:15px 0}
.detail{background:#f8f9fa;border-radius:11px;padding:11px 12px;min-width:0}.detail span{display:block;color:#707784;font-size:11px;margin-bottom:5px}.detail b{font-size:13px;overflow-wrap:anywhere}
.ifood-ok{color:#16814a}.ifood-wait{color:#a45b00}.ifood-off{color:#777}
.actions{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid #eee;padding-top:14px;align-items:center}
.actions select,.actions button{height:38px;border-radius:9px;border:1px solid #d5d7dc;background:#fff;padding:0 12px;font-weight:800;cursor:pointer}
.actions .primary{background:#ffd400;border-color:#d8b800}.actions .danger{color:#a72538;background:#fff1f2;border-color:#efbbc2}
.actions .secondary{background:#f6f7f8}
.empty{background:#fff;border:1px solid #ddd;border-radius:15px;padding:36px;text-align:center;color:#777}
@media(max-width:900px){.heading{flex-direction:column;align-items:stretch}.stats{grid-template-columns:repeat(2,1fr)}.details{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.top{padding:18px}.client-top{flex-direction:column}.details{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header class="top">
  <div><div class="brand">TURBOFLOW ADMIN</div><small>Clientes, planos e renovações</small></div>
  <button class="logout" onclick="logout()">Sair</button>
</header>
<main>
  <div class="heading">
    <div><h1>Clientes</h1><p>Controle os acessos sem precisar configurar o iFood de cada loja.</p></div>
    <div class="stats">
      <div class="stat"><b id="stPending">0</b><span>Pendentes</span></div>
      <div class="stat"><b id="stActive">0</b><span>Ativos</span></div>
      <div class="stat"><b id="stExpiring">0</b><span>Vencendo</span></div>
      <div class="stat"><b id="stExpired">0</b><span>Vencidos</span></div>
    </div>
  </div>

  <div class="filters">
    <button class="active" data-filter="all">Todos</button>
    <button data-filter="pending">Pendentes</button>
    <button data-filter="active">Ativos</button>
    <button data-filter="expiring">Vencendo em até 3 dias</button>
    <button data-filter="expired">Vencidos</button>
    <button data-filter="blocked">Bloqueados</button>
  </div>

  <div id="clients"></div>
  <div id="empty" class="empty" style="display:none">Nenhum cliente nesse filtro.</div>
</main>
<script>
let users=[], filter="all";
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const date=v=>v?new Date(v).toLocaleDateString("pt-BR"):"—";

function days(u){
  if(!u.planExpiresAt)return null;
  return Math.max(0,Math.ceil((new Date(u.planExpiresAt).getTime()-Date.now())/86400000));
}
function status(u){
  if(u.status==="blocked")return "blocked";
  if(u.status==="pending")return "pending";
  if(u.status==="active"){
    const d=days(u);
    if(u.expired||d===0)return "expired";
    if(d!==null&&d<=3)return "expiring";
    return "active";
  }
  return u.status||"pending";
}
function label(s){return {pending:"Aguardando",active:"Ativo",expiring:"Vencendo",expired:"Vencido",blocked:"Bloqueado"}[s]||s}
function ifood(u){
  if(u.ifoodConnected)return `<b class="ifood-ok">● Conectado</b>${u.ifoodMerchantName?`<br><span class="muted">${esc(u.ifoodMerchantName)}</span>`:""}`;
  if(u.ifoodLinkStatus==="requested")return `<b class="ifood-wait">● Solicitação pendente</b><br><span class="muted">ID: ${esc(u.ifoodRequestedMerchantId||u.ifoodRequestedIdentifier||"—")}</span>`;
  if(["code_generated","authorized_waiting_merchant","select_merchant"].includes(u.ifoodLinkStatus))return `<b class="ifood-wait">● Configurando</b>`;
  return `<b class="ifood-off">● Não conectado</b>`;
}
function render(){
  let p=0,a=0,x=0,e=0;
  users.forEach(u=>{const s=status(u);if(s==="pending")p++;if(s==="active")a++;if(s==="expiring"){a++;x++;}if(s==="expired")e++;});
  stPending.textContent=p;stActive.textContent=a;stExpiring.textContent=x;stExpired.textContent=e;

  const list=users.filter(u=>filter==="all"||status(u)===filter);
  clients.innerHTML=list.map(u=>{
    const s=status(u), d=days(u);
    return `<article class="client-card">
      <div class="client-top">
        <div class="identity"><h3>${esc(u.name)}</h3><div class="muted">${esc(u.email)}</div></div>
        <span class="badge ${s}">${label(s)}</span>
      </div>
      <div class="details">
        <div class="detail"><span>WhatsApp</span><b>${esc(u.phone||"—")}</b></div>
        <div class="detail"><span>Loja</span><b>${esc(u.storeName||"Ainda não configurada")}</b><br><span>${esc(u.cnpj||"")}</span></div>
        <div class="detail"><span>Plano</span><b>${u.planDays?u.planDays+" dias":"—"}</b><br><span>${d===null?"Sem vencimento":d===0?"Vencido":d+" dias restantes"}</span></div>
        <div class="detail"><span>Vencimento</span><b>${date(u.planExpiresAt)}</b></div>
        <div class="detail"><span>iFood</span>${ifood(u)}</div>
      </div>
      <div class="actions">
        <select id="days-${u.id}"><option value="7">7 dias</option><option value="30" selected>30 dias</option><option value="90">90 dias</option></select>
        <button class="primary" onclick="activate('${u.id}')">${s==="expired"?"Renovar":"Ativar / adicionar dias"}</button>
        ${u.ifoodLinkStatus==="requested" ? `<button class="secondary" onclick="copyIfoodId('${esc(u.ifoodRequestedMerchantId||u.ifoodRequestedIdentifier||"")}')">Copiar ID iFood</button>` : ""}
        ${u.status==="blocked"?`<button class="secondary" onclick="activate('${u.id}')">Liberar</button>`:`<button class="secondary" onclick="blockUser('${u.id}')">Bloquear</button>`}
        <button class="danger" onclick="deleteUser('${u.id}','${esc(u.name).replace(/'/g,"&#39;")}')">Excluir cliente</button>
      </div>
    </article>`;
  }).join("");
  empty.style.display=list.length?"none":"block";
}
async function load(){
  const r=await fetch("/api/admin/users");
  if(r.status===401||r.status===403)return location.href="/login.html";
  users=(await r.json()).users||[];render();
}
document.querySelectorAll(".filters button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");filter=b.dataset.filter;render();
});
async function activate(id){
  const d=Number(document.getElementById("days-"+id).value);
  await fetch(`/api/admin/users/${id}/plan`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"activate",days:d})});load();
}
async function blockUser(id){
  if(!confirm("Bloquear o acesso deste cliente?"))return;
  await fetch(`/api/admin/users/${id}/plan`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"block"})});load();
}
async function deleteUser(id,name){
  if(!confirm(`Excluir definitivamente "${name}"?`))return;
  const r=await fetch(`/api/admin/users/${id}`,{method:"DELETE"});
  if(!r.ok)return alert("Não foi possível excluir o cliente.");
  load();
}
async function copyIfoodId(id){
  if(!id)return alert("Este cliente não informou o ID.");
  try{await navigator.clipboard.writeText(id);alert("ID do iFood copiado.");}
  catch{prompt("Copie o ID:",id);}
}
async function logout(){await fetch("/api/auth/logout",{method:"POST"});location.href="/login.html"}
load();
</script>
</body></html>
