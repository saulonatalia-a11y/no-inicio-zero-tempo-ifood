<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TurboFlow Admin</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#171717}.top{background:#0b0b0b;color:#fff;padding:22px 28px;display:flex;justify-content:space-between;align-items:center}.brand{color:#ffd400;font-weight:950;font-size:25px}.top button{background:#252525;color:#fff;border:1px solid #444;padding:9px 13px;border-radius:8px}.main{max-width:1200px;margin:28px auto;padding:0 18px}.head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:20px}.stats{display:flex;gap:10px}.stat{background:#fff;border:1px solid #ddd;border-radius:12px;padding:13px 16px}.stat b{font-size:22px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;overflow:hidden}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px;border-bottom:1px solid #eee;font-size:13px}th{background:#fafafa}.status{padding:5px 8px;border-radius:999px;font-weight:800;font-size:11px}.pending{background:#fff1bf;color:#7d6400}.active{background:#e8f7ee;color:#237243}.expired{background:#feecef;color:#a13243}.blocked{background:#eee;color:#555}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button,.actions select{padding:7px 9px;border:1px solid #d0d0d0;border-radius:7px;background:#fff}.actions .go{background:#ffd400;border-color:#ddba00;font-weight:850}@media(max-width:850px){.card{overflow:auto}table{min-width:980px}}</style></head>
<body><header class="top"><div><div class="brand">TURBOFLOW ADMIN</div><small>Clientes e planos</small></div><button onclick="logout()">Sair</button></header>
<main class="main"><div class="head"><div><h1>Clientes</h1><p>Cadastros aguardando aprovação, planos ativos e vencimentos.</p></div><div class="stats"><div class="stat"><b id="stPending">0</b><br><small>Pendentes</small></div><div class="stat"><b id="stActive">0</b><br><small>Ativos</small></div><div class="stat"><b id="stExpired">0</b><br><small>Vencidos</small></div></div></div>
<div class="card"><table><thead><tr><th>Cliente</th><th>Loja</th><th>Status</th><th>Plano</th><th>Vencimento</th><th>Cadastro</th><th>Ações</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script>
const fmt=d=>d?new Date(d).toLocaleString("pt-BR"):"—";
async function load(){const r=await fetch("/api/admin/users");if(r.status===401||r.status===403)return location.href="/login.html";const d=await r.json();const users=d.users||[];let p=0,a=0,e=0;document.querySelector("#rows").innerHTML=users.map(u=>{let st=u.status;if(u.status==="active"&&u.expired)st="expired";if(st==="pending")p++;else if(st==="active")a++;else if(st==="expired")e++;return `<tr><td><b>${esc(u.name)}</b><br>${esc(u.email)}</td><td>${esc(u.storeName||"—")}<br><small>${esc(u.cnpj||"")}</small></td><td><span class="status ${st}">${st==="pending"?"Aguardando":st==="active"?"Ativo":st==="expired"?"Vencido":"Bloqueado"}</span></td><td>${u.planDays?u.planDays+" dias":"—"}</td><td>${fmt(u.planExpiresAt)}</td><td>${fmt(u.createdAt)}</td><td><div class="actions"><select id="days-${u.id}"><option value="7">7 dias</option><option value="30" selected>30 dias</option><option value="90">90 dias</option></select><button class="go" onclick="plan('${u.id}')">${st==="expired"?"Renovar":"Ativar"}</button><button onclick="blockUser('${u.id}')">Bloquear</button></div></td></tr>`}).join("");stPending.textContent=p;stActive.textContent=a;stExpired.textContent=e}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
async function plan(id){const days=Number(document.querySelector("#days-"+id).value);await fetch(`/api/admin/users/${id}/plan`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"activate",days})});load()}
async function blockUser(id){if(!confirm("Bloquear este cliente?"))return;await fetch(`/api/admin/users/${id}/plan`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"block"})});load()}
async function logout(){await fetch("/api/auth/logout",{method:"POST"});location.href="/login.html"}
load();
</script></body></html>
