<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TurboFlow KDS — Pedidos iFood</title>
<style>
*{box-sizing:border-box}
:root{--bg:#101113;--panel:#1a1c20;--panel2:#22252b;--line:#30343c;--text:#f7f7f7;--muted:#9aa0aa;--yellow:#ffd400;--red:#ff4d5e;--green:#22c55e;--blue:#4da3ff;--orange:#ff9d2e}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
header{height:68px;background:#070707;border-bottom:1px solid #242424;padding:0 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30}
.brand{font-size:25px;font-weight:950;color:var(--yellow);letter-spacing:.5px}
.brand small{font-size:11px;color:#fff;background:#2b2b2b;padding:4px 7px;border-radius:6px;margin-left:8px;vertical-align:middle}
.top-actions{display:flex;gap:8px;align-items:center}
button,a.btn{border:1px solid #3b3f47;background:#202329;color:#fff;padding:10px 13px;border-radius:9px;font-weight:850;cursor:pointer;text-decoration:none}
button.primary{background:var(--yellow);border-color:var(--yellow);color:#111}.danger{background:#2d1518!important;color:#ff98a1!important;border-color:#71323a!important}
.kds-wrap{padding:14px}
.kds-head{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:12px}
.store-title h1{font-size:24px;margin:0}.store-title .sub{color:var(--muted);font-size:13px;margin-top:3px}
.badges{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.badge{background:#181a1e;border:1px solid var(--line);padding:8px 11px;border-radius:999px;font-size:12px;font-weight:900}
.badge.online{color:#7df0a1}.badge.warn{color:#ffd36d}
.hml-panel{background:#332c10;border:1px solid #685a19;border-radius:12px;padding:12px;margin-bottom:12px}.hml-row{display:flex;gap:8px;margin-top:9px}.hml-row input{flex:1;background:#15171a;color:#fff;border:1px solid #484c55;border-radius:8px;padding:10px}
.kds-board{
display:grid;
grid-template-columns:repeat(5,minmax(250px,1fr));
gap:12px;
align-items:start;
overflow-x:auto;
padding-bottom:10px
}
.lane{
background:transparent;
border:0;
border-radius:0;
display:flex;
flex-direction:column;
min-width:250px;
overflow:visible
}
.lane-head{
padding:10px 8px;
border:0;
display:flex;
align-items:center;
justify-content:space-between;
font-weight:950;
font-size:14px;
letter-spacing:.5px;
background:#17191d;
border-radius:10px;
margin-bottom:8px
}
.lane-head .count{background:#30343c;border-radius:999px;padding:3px 8px}
.lane.accept .lane-head{border-top:3px solid var(--yellow)}.lane.prep .lane-head{border-top:3px solid var(--orange)}.lane.ready .lane-head{border-top:3px solid var(--green)}.lane.route .lane-head{border-top:3px solid var(--blue)}.lane.done .lane-head{border-top:3px solid #71717a}
.lane-body{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:8px;
padding:0;
overflow:visible
}
.ticket{
background:var(--panel2);
border:1px solid #343842;
border-radius:12px;
margin:0;
overflow:hidden;
box-shadow:0 3px 10px rgba(0,0,0,.18);
aspect-ratio:1/1;
display:flex;
flex-direction:column;
min-height:0
}
.ticket.urgent{border-color:#9b313a;box-shadow:0 0 0 1px rgba(255,77,94,.18)}
.ticket-top{
padding:9px;
display:flex;
justify-content:space-between;
gap:6px;
border-bottom:1px solid #31343b
}
.ticket-id{font-size:21px;font-weight:950;line-height:1}
.ticket-time{font-size:11px;font-weight:900;color:#d7dae0;margin-top:4px}
.ticket-time.hot{color:#ff6b77}
.ticket-status{font-size:10px;font-weight:950;padding:4px 6px;border-radius:999px;background:#333740;color:#d9dce1;white-space:nowrap}
.ticket-body{
padding:8px 9px;
flex:1;
overflow:auto
}
.item{display:flex;gap:6px;line-height:1.2;margin:4px 0;font-size:12px}
.qty{font-size:13px;font-weight:950;color:var(--yellow);min-width:20px}
.item-name{font-weight:800}
.total-row{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed #3b3f47;margin-top:8px;padding-top:8px}.total{font-size:16px;font-weight:950}.channel{font-size:10px;color:var(--muted)}
.actions{
display:grid;
grid-template-columns:1fr;
gap:5px;
padding:0 8px 8px
}
.actions.two{grid-template-columns:1fr 1fr}
.actions button{width:100%;padding:8px 6px;font-size:11px}
.empty{height:100%;display:grid;place-items:center;color:#646a74;font-weight:800;text-align:center;padding:20px}
.msg{padding:9px;border-radius:8px;margin-top:8px;background:#252930}.ok{background:#153322;color:#7df0a1}.err{background:#3a191e;color:#ff9aa3}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:grid;place-items:center;padding:16px;z-index:99}.hidden{display:none!important}.box{background:#1b1d21;border:1px solid #3b3f47;color:#fff;border-radius:14px;padding:18px;max-width:560px;width:100%}.box h2{margin-top:0}
.reason-list{display:grid;gap:7px;max-height:360px;overflow:auto;margin:12px 0}.reason{border:1px solid #3b3f47;background:#23262c;border-radius:9px;padding:10px;cursor:pointer}.reason input{margin-right:8px}
.debug{background:#090a0c;color:#d5d8dd;padding:10px;border-radius:8px;font:11px monospace;white-space:pre-wrap;max-height:220px;overflow:auto}
@media(max-width:1500px){
 .kds-board{grid-template-columns:repeat(5,250px)}
}
@media(max-width:900px){
 .kds-board{grid-template-columns:repeat(5,240px)}
 .lane-body{grid-template-columns:repeat(2,112px)}
}.lane{min-height:420px}.kds-head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header>
 <div class="brand">TURBOFLOW <small>KDS</small></div>
 <div class="top-actions"><a id="adminBack" class="btn hidden" href="/admin.html">Admin</a><a class="btn" href="/integrations.html">Integrações</a><button onclick="logout()">Sair</button></div>
</header>

<div class="kds-wrap">
 <div class="kds-head">
  <div class="store-title"><h1 id="storeTitle">KDS de Pedidos</h1><div id="storeLine" class="sub">Pedidos em cartões quadrados por etapa</div></div>
  <div class="badges"><div class="badge">Tela: tempo real</div><div class="badge">Polling iFood: 30s</div><div id="connection" class="badge warn">iFood: verificando</div></div>
 </div>

 <section id="hmlPanel" class="hml-panel hidden">
   <b>Homologação iFood</b>
   <div class="hml-row"><input id="hmlOrderId" placeholder="UUID do pedido"><input id="hmlDisplayId" placeholder="Número do pedido"><button id="hmlImportBtn" class="primary">Carregar</button></div>
   <div id="hmlImportMsg" class="msg hidden"></div>
 </section>

 <div class="kds-board">
  <section class="lane accept"><div class="lane-head">ACEITAR <span id="cNew" class="count">0</span></div><div id="new" class="lane-body"></div></section>
  <section class="lane prep"><div class="lane-head">EM PREPARO <span id="cPrep" class="count">0</span></div><div id="prep" class="lane-body"></div></section>
  <section class="lane ready"><div class="lane-head">PRONTO <span id="cReady" class="count">0</span></div><div id="ready" class="lane-body"></div></section>
  <section class="lane route"><div class="lane-head">EM ROTA <span id="cRoute" class="count">0</span></div><div id="route" class="lane-body"></div></section>
  <section class="lane done"><div class="lane-head">FINALIZADOS <span id="cDone" class="count">0</span></div><div id="done" class="lane-body"></div></section>
 </div>
</div>

<div id="cancelModal" class="modal hidden"><div class="box">
 <h2>Cancelar pedido <span id="cancelDisplay"></span></h2>
 <p style="color:#9aa0aa">Motivos retornados diretamente pelo iFood.</p>
 <div id="reasons" class="reason-list"></div>
 <div id="cancelMsg" class="msg hidden"></div>
 <div class="actions two"><button onclick="closeCancel()">Voltar</button><button id="confirmCancel" class="danger">Confirmar cancelamento</button></div>
</div></div>

<script>
let me=null,currentCancel=null,selectedReason=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function api(path,opt){const r=await fetch(path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.message||d.error||"Erro"),{data:d,status:r.status});return d}
function status(o){return String(o.status||"").toUpperCase()}
function stage(o){
 const s=status(o);
 if(o.isClosed||["CANCELLED","CANCELED","CONCLUDED","COMPLETED","CON"].includes(s))return"done";
 if(["DISPATCHED","DSP"].includes(s)||o.stage==="DELIVERY")return"route";
 if(["READY_TO_PICKUP","RTP","READY_REQUESTED","DISPATCH_REQUESTED"].includes(s)||o.stage==="READY")return"ready";
 if(["CONFIRMED","CFM","PREPARATION","PREPARATION_REQUESTED","PRS","DDCR","CONFIRM_REQUESTED"].includes(s)||o.stage==="PREPARATION")return"prep";
 return"new";
}
function label(o){
 const s=status(o),st=stage(o);
 if(s==="CANCELLED"||s==="CANCELED")return"CANCELADO";
 if(st==="done")return"CONCLUÍDO";
 if(st==="route")return"DESPACHADO";
 if(st==="ready")return"PRONTO";
 if(st==="prep")return"PREPARO";
 return"NOVO";
}
function money(v){const n=Number(v?.orderAmount??v?.total??v??0);return isFinite(n)?n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"}):"—"}
function age(o){
 const t=new Date(o.receivedAt||o.createdAt||o.updatedAt||Date.now()).getTime();
 const m=Math.max(0,Math.floor((Date.now()-t)/60000));
 return {m,text:m<1?"agora":`${m} min`,hot:m>=10};
}
function card(o){
 const a=age(o), s=stage(o);
 const rawItems=(o.items||[]).slice(0,8);
 const items=rawItems.length?rawItems.map(i=>`<div class="item"><div class="qty">${esc(i.quantity||1)}x</div><div class="item-name">${esc(i.name||i.description||"Item")}</div></div>`).join(""):`<div style="color:#8f959f;font-size:12px">Itens não informados</div>`;
 const closed=s==="done";
 const buttons=[];
 if(s==="new")buttons.push(`<button class="primary" onclick="act('${o.id}','confirm')">ACEITAR AGORA</button>`);
 if(s==="prep")buttons.push(`<button class="primary" onclick="act('${o.id}','ready')">MARCAR PRONTO</button>`);
 if(s==="ready")buttons.push(`<button class="primary" onclick="act('${o.id}','dispatch')">DESPACHAR</button>`);
 if(!closed)buttons.push(`<button class="danger" onclick="openCancel('${o.id}','${esc(o.displayId||"")}')">CANCELAR</button>`);
 return `<article class="ticket ${a.hot&&!closed?"urgent":""}">
  <div class="ticket-top">
   <div><div class="ticket-id">#${esc(o.displayId||o.id?.slice(0,8))}</div><div class="ticket-time ${a.hot?"hot":""}">${a.text}</div></div>
   <div class="ticket-status">${esc(label(o))}</div>
  </div>
  <div class="ticket-body">${items}<div class="total-row"><div class="total">${money(o.total)}</div><div class="channel">iFood</div></div></div>
  ${buttons.length?`<div class="actions ${buttons.length>1?"two":""}">${buttons.join("")}</div>`:""}
 </article>`;
}
async function load(){
 try{
  const list=await api("/api/orders");
  const g={new:[],prep:[],ready:[],route:[],done:[]};list.forEach(o=>g[stage(o)].push(o));
  for(const k of Object.keys(g))$("#"+k).innerHTML=g[k].map(card).join("")||`<div class="empty">Nenhum pedido</div>`;
  cNew.textContent=g.new.length;cPrep.textContent=g.prep.length;cReady.textContent=g.ready.length;cRoute.textContent=g.route.length;cDone.textContent=g.done.length;
 }catch(e){if(e.status===401)location.href="/login.html"}
}
async function act(id,action){try{await api(`/api/orders/${encodeURIComponent(id)}/${action}`,{method:"POST"});await load()}catch(e){alert("Erro: "+e.message)}}
async function openCancel(id,display){
 currentCancel=id;selectedReason=null;cancelDisplay.textContent=display?`#${display}`:"";reasons.innerHTML="Consultando motivos...";cancelMsg.className="msg hidden";cancelModal.classList.remove("hidden");
 try{
  const d=await api(`/api/orders/${encodeURIComponent(id)}/cancellation-reasons`);
  if(!d.reasons?.length){reasons.innerHTML=`<div class="msg err">O iFood não retornou motivos válidos.</div>${d?.diagnostic?`<div class="debug">${esc(JSON.stringify(d.diagnostic,null,2))}</div>`:""}`;return}
  reasons.innerHTML=d.reasons.map(r=>`<label class="reason"><input type="radio" name="reason" value="${esc(r.code)}"><b>${esc(r.code)}</b> — ${esc(r.description||"Motivo")}</label>`).join("");
  reasons.querySelectorAll('input[name="reason"]').forEach(x=>x.onchange=()=>selectedReason=x.value);
 }catch(e){reasons.innerHTML=`<div class="msg err">${esc(e.message)}</div>`}
}
function closeCancel(){cancelModal.classList.add("hidden");currentCancel=null;selectedReason=null}
confirmCancel.onclick=async()=>{
 if(!selectedReason){cancelMsg.className="msg err";cancelMsg.textContent="Selecione um motivo.";return}
 try{confirmCancel.disabled=true;await api(`/api/orders/${encodeURIComponent(currentCancel)}/cancel`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({reason:selectedReason})});cancelMsg.className="msg ok";cancelMsg.textContent="Cancelamento enviado ao iFood.";setTimeout(()=>{closeCancel();load()},900)}catch(e){cancelMsg.className="msg err";cancelMsg.textContent=e.message}finally{confirmCancel.disabled=false}
}
async function boot(){
 const d=await api("/api/auth/me");me=d.user;if(!me)return location.href="/login.html";if(me.role==="admin")adminBack.classList.remove("hidden");
 try{
  const ctx=await api("/api/orders/context");
  if(ctx.mode==="homologation"){storeLine.textContent=ctx.merchantName||"Loja de teste iFood";connection.textContent=ctx.authorized?"iFood HML: conectado":"iFood HML: não autorizado";connection.className="badge "+(ctx.authorized?"online":"warn");if(ctx.canImportHomologationOrder)hmlPanel.classList.remove("hidden")}
  else{storeLine.textContent=ctx.merchantName||me.storeName||"Minha loja";connection.textContent=ctx.authorized?"iFood: conectado":"iFood: desconectado";connection.className="badge "+(ctx.authorized?"online":"warn")}
 }catch{storeLine.textContent="Minha loja";connection.textContent="iFood: verificando"}
 load();setInterval(load,2000);
}
hmlImportBtn.onclick=async()=>{
 const orderId=hmlOrderId.value.trim(),displayId=hmlDisplayId.value.trim();if(!orderId)return;
 hmlImportBtn.disabled=true;try{const d=await api("/api/orders/hml-import",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({orderId,displayId})});hmlImportMsg.className="msg ok";hmlImportMsg.textContent=`Pedido #${d.order?.displayId||displayId} carregado.`;hmlImportMsg.classList.remove("hidden");await load()}catch(e){hmlImportMsg.className="msg err";hmlImportMsg.textContent=e.message;hmlImportMsg.classList.remove("hidden")}finally{hmlImportBtn.disabled=false}
};
async function logout(){await fetch("/api/auth/logout",{method:"POST"});location.href="/login.html"}
boot();
</script>
</body></html>
